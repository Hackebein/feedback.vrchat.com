name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analytics-security:
    name: analytics-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      opensearch:
        image: opensearchproject/opensearch:latest
        env:
          discovery.type: single-node
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: Analytics_CI_Only_9!mQ2
          OPENSEARCH_JAVA_OPTS: "-Xms768m -Xmx768m"
          plugins.security.ssl.http.enabled: "false"
          script.allowed_types: none
        ports:
          - 127.0.0.1:9200:9200
    env:
      OPENSEARCH_URL: http://127.0.0.1:9200
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: Analytics_CI_Only_9!mQ2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: search-ui/package-lock.json
      - name: Prepare secured OpenSearch
        run: |
          set -euo pipefail
          sudo sysctl -w vm.max_map_count=262144
          docker start "${{ job.services.opensearch.id }}" || true
          for _ in $(seq 1 90); do
            if curl -fsS -u "admin:$OPENSEARCH_INITIAL_ADMIN_PASSWORD" "$OPENSEARCH_URL/_cluster/health" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs "${{ job.services.opensearch.id }}"
          exit 1
      - name: Install search-ui
        working-directory: search-ui
        run: npm ci
      - name: Test analytics with production permissions
        working-directory: search-ui
        run: npx tsx scripts/test-analytics-security.ts

  search-ui:
    name: search-ui
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      opensearch:
        image: opensearchproject/opensearch:3.9.0
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
    env:
      OPENSEARCH_URL: http://127.0.0.1:9200
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: search-ui/package-lock.json

      - name: Prepare OpenSearch
        run: |
          set -euo pipefail
          sudo sysctl -w vm.max_map_count=262144
          if ! curl -fsS "$OPENSEARCH_URL" >/dev/null 2>&1; then
            docker start "${{ job.services.opensearch.id }}"
          fi
          for _ in $(seq 1 60); do
            if curl -fsS "$OPENSEARCH_URL" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs "${{ job.services.opensearch.id }}" || true
          echo "OpenSearch did not become ready" >&2
          exit 1

      - name: Install search-ui
        working-directory: search-ui
        run: npm ci

      - name: Test search-ui
        working-directory: search-ui
        run: npm test

      - name: Build search-ui
        working-directory: search-ui
        run: npm run build

  feedback-search-bridge:
    name: feedback-search-bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: feedback-search-bridge/package-lock.json

      - name: Install
        working-directory: feedback-search-bridge
        run: npm ci

      - name: Test
        working-directory: feedback-search-bridge
        run: npm test

      - name: Typecheck
        working-directory: feedback-search-bridge
        run: npm run typecheck

      - name: Build
        working-directory: feedback-search-bridge
        run: npm run build

  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            scripts/requirements-ingest.txt
            scripts/requirements-canny-wake.txt

      - name: Install dependencies
        run: |
          python3 -m pip install \
            -r scripts/requirements-ingest.txt \
            -r scripts/requirements-canny-wake.txt \
            jinja2

      - name: Run scripts/test_*.py
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/test_*.py)
          if ((${#tests[@]} == 0)); then
            echo "No scripts/test_*.py files" >&2
            exit 1
          fi
          for test in "${tests[@]}"; do
            echo "=== $test ==="
            python3 "$test"
          done

  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: notify/go.mod
          cache: true
          cache-dependency-path: |
            notify/go.mod
            notify/go.sum
            search-canny/go.mod

      - name: gofmt
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l notify search-canny)
          if [[ -n "$unformatted" ]]; then
            echo "gofmt would change:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet and test notify
        working-directory: notify
        run: |
          set -euo pipefail
          go vet ./...
          go test -count=1 ./...

      - name: Vet and test search-canny
        working-directory: search-canny
        run: |
          set -euo pipefail
          go vet ./...
          go test -count=1 ./...

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Cache Terraform providers
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/terraform-plugin-cache
          key: terraform-${{ hashFiles('deploy/terraform/.terraform.lock.hcl') }}

      - name: fmt, init, validate
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugin-cache
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
