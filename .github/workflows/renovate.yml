name: Renovate

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level"
        required: false
        default: "info"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require Renovate token
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RENOVATE_TOKEN}" ]]; then
            echo "Set repository secret RENOVATE_TOKEN to a PAT or GitHub App token with contents, pull-requests, and workflow scopes." >&2
            echo "The workflow GITHUB_TOKEN cannot be used: pull requests it opens do not trigger CI." >&2
            exit 1
          fi

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.8
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: renovate.json
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}
