name: Renovate

# Authenticate Renovate with secrets.RENOVATE_TOKEN, a classic PAT or a
# GitHub App token. It needs contents and pull-requests write, plus the
# workflow scope so Renovate can update Actions files.
#
# Do not pass the workflow GITHUB_TOKEN. GitHub does not start pull_request
# or push workflows for events that token creates, so CI would never run on
# those Renovate PRs (they show up as github-actions[bot]). A PAT or App
# token opens the PRs as that identity and CI runs.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level"
        required: false
        default: "info"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Renovate token
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${RENOVATE_TOKEN}" ]]; then
            echo "Set repository secret RENOVATE_TOKEN to a PAT or GitHub App token with contents, pull-requests, and workflow scopes." >&2
            echo "The workflow GITHUB_TOKEN cannot be used: pull requests it opens do not trigger CI." >&2
            exit 1
          fi

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.14
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: renovate.json
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ github.event.inputs.logLevel || 'info' }}
