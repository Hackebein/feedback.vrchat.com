name: Update boards

on:
  schedule:
    - cron: "0/10 * * * *"
  workflow_dispatch:
    inputs:
      refresh-oldest:
        description: "How many oldest posts to refresh on top of new+updated+notifications"
        required: false
        default: "500"
      refresh-newest:
        description: "How many activity-based posts to refresh on top of new+updated"
        required: false
        default: "500"
  repository_dispatch:
    types: [canny-wake]

permissions:
  contents: write

concurrency:
  group: update-boards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Set up scrape-state worktree
        run: |
          set -euo pipefail
          git fetch origin scrape-state:scrape-state || true
          rm -rf .scrape-state
          if git show-ref --verify --quiet refs/heads/scrape-state; then
            git worktree add .scrape-state scrape-state
          elif git ls-remote --exit-code --heads origin scrape-state >/dev/null 2>&1; then
            git fetch origin scrape-state:scrape-state
            git worktree add .scrape-state scrape-state
          else
            echo "scrape-state branch missing; creating orphan seed"
            mkdir -p .scrape-state
            git -C .scrape-state init
            # Placeholder; updater will write scrape-state.json
            printf '%s\n' '{"scrapedAt":{},"votedPostIds":[],"scraperUserId":null,"seenNotificationIds":[]}' \
              > .scrape-state/scrape-state.json
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jinja2 pyotp

      - name: Restore VRChat session cache
        uses: actions/cache@v4
        with:
          path: .vrchat-session/cookies.jar
          # Unique primary key so a refreshed jar is saved after every run.
          # restore-keys still loads the newest v2 jar from a previous run.
          key: vrchat-canny-session-v2-${{ github.run_id }}
          restore-keys: |
            vrchat-canny-session-v2-
          save-always: true

      - name: Run update
        id: update
        continue-on-error: true
        env:
          PYTHONUNBUFFERED: "1"
          SCRAPE_STATE_DIR: ${{ github.workspace }}/.scrape-state
          CANNY_COOKIE_JAR: ${{ github.workspace }}/.vrchat-session/cookies.jar
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          VRCHAT_USERNAME: ${{ secrets.VRCHAT_USERNAME }}
          VRCHAT_PASSWORD: ${{ secrets.VRCHAT_PASSWORD }}
          VRCHAT_TOTP_SECRET: ${{ secrets.VRCHAT_TOTP_SECRET }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            # Host canny-wake daemon: newest sweep + notifications; voting stays on host.
            python3 scripts/update.py --refresh-oldest 0 --refresh-newest 0 --vote-batch 0
            exit 0
          fi
          OLDEST="${{ github.event.inputs.refresh-oldest }}"
          NEWEST="${{ github.event.inputs.refresh-newest }}"
          # schedule / workflow_dispatch → plan defaults
          OLDEST="${OLDEST:-500}"
          NEWEST="${NEWEST:-500}"
          # Host feedback-canny-wake daemon owns paced upvotes.
          python3 scripts/update.py \
            --refresh-oldest "${OLDEST}" \
            --refresh-newest "${NEWEST}" \
            --vote-batch 0

      - name: Commit and push main
        if: steps.update.outcome == 'success' || steps.update.outcome == 'failure'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          # Never commit scrape-state worktree or VRChat session cookies into main
          git reset -q -- .scrape-state || true
          git reset -q -- .vrchat-session || true
          if git diff --cached --quiet; then
            echo "Nothing to commit on main."
          else
            git commit -m "Boards updated ($(date -u '+%Y-%m-%d %H:%M'))"
            # Shallow clone + concurrent pushes (manual/schedule) need rebase before push.
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: Commit and push scrape-state
        if: steps.update.outcome == 'success' || steps.update.outcome == 'failure'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          if [[ ! -d .scrape-state/.git ]] && [[ ! -f .scrape-state/scrape-state.json ]]; then
            echo "No scrape-state worktree; skip"
            exit 0
          fi
          if [[ -d .scrape-state/.git ]] || git -C .scrape-state rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            cd .scrape-state
            git add scrape-state.json
            if git diff --cached --quiet; then
              echo "Nothing to commit on scrape-state."
            else
              git commit -m "scrape-state $(date -u '+%Y-%m-%d %H:%M')"
              git pull --rebase --autostash origin scrape-state || true
              git push origin HEAD:scrape-state
            fi
          else
            # First-time orphan push from a plain directory
            cd .scrape-state
            git init
            git checkout --orphan scrape-state
            git add scrape-state.json
            git commit -m "scrape-state seed"
            git push -u origin HEAD:scrape-state
          fi

      - name: Fail job if update failed
        if: steps.update.outcome == 'failure'
        run: |
          echo "Update step failed (often Canny SSO / VRChat session limit)." >&2
          echo "Board/scrape-state commits above still ran when there was work to push." >&2
          exit 1
