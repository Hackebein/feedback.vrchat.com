name: Update boards

on:
  schedule:
    - cron: "0/10 * * * *"
  workflow_dispatch:
    inputs:
      refresh-oldest:
        description: "How many oldest posts to refresh on top of new+updated"
        required: false
        default: "500"
      refresh-newest:
        description: "How many activity-based posts to refresh on top of new+updated"
        required: false
        default: "500"

permissions:
  contents: write

concurrency:
  group: update-boards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jinja2

      - name: Run update
        env:
          PYTHONUNBUFFERED: "1"
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: python3 scripts/update.py --refresh-oldest ${{ github.event.inputs.refresh-oldest || '5000' }} --refresh-newest ${{ github.event.inputs.refresh-newest || '500' }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Boards updated ($(date -u '+%Y-%m-%d %H:%M'))" || { echo "Nothing to commit."; exit 0; }
          git push origin HEAD:"${GITHUB_REF_NAME}"
