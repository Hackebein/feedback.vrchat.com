# OpenSearch backing store. HTTP listens on loopback; ingest / gateway hit 127.0.0.1:9200.
services:
  opensearch:
    image: opensearchproject/opensearch:latest
    env_file:
      - /etc/feedback-search/admin.env
    environment:
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms768m -Xmx768m
      - plugins.security.ssl.http.enabled=false
      - script.allowed_types=none
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
    expose:
      - "9200"
    restart: unless-stopped

volumes:
  opensearch_data:
