# Per-IP concurrency cap (in-flight upstream connections per remote address).
limit_conn_zone $binary_remote_addr zone=os_search_parallel:10m;

# Per-IP request rate cap. Bursts allowed via `burst=...` on each location.
# 10 r/s sustained × 20 burst nodelay = quick clients OK, scrapers throttled.
limit_req_zone $binary_remote_addr zone=os_search_rps:10m rate=10r/s;
